[package]
name = "tresh"
version = "0.1.0"
description = "Tresh desktop editor"
authors = ["Solcogito"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tresh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
